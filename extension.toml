id = "skript"
name = "Skript"
description = "Skript syntax highlighting for Zed editor"
version = "0.1.0"
schema_version = 1
authors = ["WIL24000223"]
repository = "https://github.com/WIL24000223/zed-skript"

[grammars.skript]
repository = "https://github.com/WIL24000223/zed-skript"
commit = "PLACEHOLDER_COMMIT_SHA"

[languages.skript]
name = "Skript"
grammar = "skript"
path_suffixes = ["sk"]
line_comments = ["# "]
block_comment = { start = "", end = "" }
brackets = [
    { start = "{", end = "}", close = true, newline = false },
    { start = "(", end = ")", close = true, newline = false },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string"] },
]
tab_size = 4
